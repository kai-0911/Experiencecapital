<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みんなの体験資本 - ExC CANVAS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Shippori+Mincho:wght@400;700&family=Cinzel:wght@400;600;700&display=swap');

        :root {
            --rose: #C85A7C;
            --rose-dark: #A04661;
            --rose-light: #E86B8F;
            --gold: #C85A7C;
            --text: #333;
            --text-light: #888;
            --bg: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Shippori Mincho', serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.8;
            overflow-x: hidden;
        }

        /* 水彩背景 */
        #paintCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2;
        }
        body::before {
            content: "";
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.6);
            pointer-events: none;
            z-index: -1;
        }

        /* ヘッダー */
        .header {
            text-align: center;
            padding: 60px 20px 40px;
            position: relative;
            z-index: 1;
        }
        .header-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            color: var(--rose);
            letter-spacing: 0.3em;
            margin-bottom: 40px;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .header-logo:hover { opacity: 1; }
        .header-title {
            font-size: 2.2rem;
            color: var(--rose);
            font-weight: 700;
            letter-spacing: 0.08em;
            margin-bottom: 10px;
        }
        .header-subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            color: var(--text-light);
            letter-spacing: 0.2em;
            font-style: italic;
        }
        .header-total {
            margin-top: 25px;
            font-size: 0.9rem;
            color: var(--text-light);
        }
        .header-total strong {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            color: var(--rose);
            margin: 0 4px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 24px 80px;
            position: relative;
            z-index: 1;
        }

        /* セクションタイトル */
        .section {
            margin-bottom: 70px;
        }
        .section-head {
            text-align: center;
            margin-bottom: 35px;
        }
        .section-label {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.8rem;
            color: var(--text-light);
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .section-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.05em;
        }

        /* ===== キャラクターランキング ===== */
        .char-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }
        .char-row {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255,255,255,0.85);
            border-radius: 10px;
            border: 1px solid rgba(200,90,124,0.08);
            transition: all 0.3s ease;
            cursor: default;
        }
        .char-row:hover {
            transform: translateX(4px);
            box-shadow: 0 4px 16px rgba(200,90,124,0.1);
            border-color: rgba(200,90,124,0.2);
        }
        .char-rank {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            font-weight: 700;
            min-width: 30px;
            text-align: center;
            color: #ccc;
        }
        .char-row:nth-child(1) .char-rank { color: #DAA520; font-size: 1.6rem; }
        .char-row:nth-child(2) .char-rank { color: #A8A8A8; font-size: 1.5rem; }
        .char-row:nth-child(3) .char-rank { color: #B87333; font-size: 1.4rem; }
        .char-img {
            width: 52px;
            height: 52px;
            object-fit: contain;
            margin: 0 12px;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.12));
            transition: transform 0.3s;
        }
        .char-row:hover .char-img { transform: scale(1.15); }
        .char-info { flex: 1; }
        .char-name {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }
        .char-bar-wrap {
            width: 100%;
            height: 6px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
        }
        .char-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--rose-light), var(--rose));
            border-radius: 4px;
            transition: width 1.5s cubic-bezier(0.25, 1, 0.5, 1);
            width: 0%;
        }
        .char-pct {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--rose);
            min-width: 50px;
            text-align: right;
        }
        .char-pct span {
            font-size: 0.75rem;
            color: var(--text-light);
        }

        /* ===== 12軸セクション ===== */
        .axis-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .axis-card {
            background: rgba(255,255,255,0.85);
            border-radius: 10px;
            border: 1px solid rgba(200,90,124,0.08);
            padding: 16px 18px;
            transition: all 0.3s ease;
        }
        .axis-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(200,90,124,0.1);
        }
        .axis-top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }
        .axis-name {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text);
        }
        .axis-avg {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--rose);
        }
        .axis-avg span {
            font-size: 0.7rem;
            color: var(--text-light);
        }
        .axis-bar-wrap {
            width: 100%;
            height: 5px;
            background: #eee;
            border-radius: 3px;
            overflow: hidden;
        }
        .axis-bar {
            height: 100%;
            border-radius: 3px;
            transition: width 1.5s cubic-bezier(0.25, 1, 0.5, 1);
            width: 0%;
        }
        .axis-desc {
            font-size: 0.72rem;
            color: var(--text-light);
            margin-top: 6px;
        }

        /* フッターボタン */
        .footer-actions {
            text-align: center;
            padding: 40px 20px;
        }
        .btn-back {
            display: inline-block;
            padding: 16px 50px;
            background: linear-gradient(135deg, var(--rose-light) 0%, var(--rose) 100%);
            color: #fff;
            font-family: 'Shippori Mincho', serif;
            font-size: 1rem;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(200,90,124,0.3);
        }
        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(200,90,124,0.4);
        }

        .footer {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-light);
            font-size: 0.75rem;
        }

        /* ローディング */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }
        .loading-spinner {
            width: 30px; height: 30px;
            border: 3px solid #eee;
            border-top-color: var(--rose);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* フェードイン */
        .fade-in {
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.6s ease;
        }
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            .header { padding: 40px 16px 30px; }
            .header-title { font-size: 1.5rem; }
            .header-total strong { font-size: 1.5rem; }
            .container { padding: 0 16px 60px; }
            .section-name { font-size: 1.2rem; }
            .char-img { width: 40px; height: 40px; margin: 0 8px; }
            .char-name { font-size: 0.82rem; }
            .char-pct { font-size: 1.1rem; min-width: 40px; }
            .axis-grid { grid-template-columns: 1fr; }
            .axis-card { padding: 14px 16px; }
        }
    </style>
</head>
<body>

<canvas id="paintCanvas"></canvas>

<div class="header">
    <div class="header-logo" onclick="location.href='/'">ExC CANVAS</div>
    <h1 class="header-title">みんなの体験資本</h1>
    <p class="header-subtitle">Experience Capital Statistics</p>
    <div class="header-total" id="header-total"></div>
</div>

<div class="container">
    <!-- キャラクター分布 -->
    <div class="section fade-in" id="sec-char">
        <div class="section-head">
            <div class="section-label">Character Distribution</div>
            <div class="section-name">キャラクタータイプ分布</div>
        </div>
        <div class="char-grid" id="char-grid">
            <div class="loading">
                <div class="loading-spinner"></div>
                データを読み込み中...
            </div>
        </div>
    </div>

    <!-- 12軸平均 -->
    <div class="section fade-in" id="sec-axis">
        <div class="section-head">
            <div class="section-label">Average Experience Capital</div>
            <div class="section-name">12軸の平均スコア</div>
        </div>
        <div class="axis-grid" id="axis-grid">
            <div class="loading">
                <div class="loading-spinner"></div>
                データを読み込み中...
            </div>
        </div>
    </div>

    <!-- フッターボタン -->
    <div class="footer-actions">
        <a href="/" class="btn-back">診断をはじめる</a>
    </div>
</div>

<div class="footer">
    <a href="https://forms.gle/Q7pZL3DfSZDCaCgW7" target="_blank" style="color: #C85A7C; text-decoration: none; opacity: 0.7; font-size: 0.85rem;">感想・お問い合わせはこちら</a><br><br>
    © 2026 ExC CANVAS - Experience Capital Assessment
</div>

<script>
// 水彩背景
const canvas = document.getElementById('paintCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const bgColors = ['#FFE4E9','#E8F5E9','#E3F2FD','#FFF9E6','#F3E5F5','#E0F7FA','#FFEBEE','#FFF3E0'];
for (let i = 0; i < 6; i++) {
    const x = Math.random() * canvas.width;
    const y = Math.random() * canvas.height;
    const size = 150 + Math.random() * 300;
    ctx.globalAlpha = 0.2 + Math.random() * 0.15;
    ctx.fillStyle = bgColors[Math.floor(Math.random() * bgColors.length)];
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fill();
}

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

// 12軸情報
const axisInfo = {
    physical:     { name: '身体的体験',   color: '#E57373', desc: '身体を使った挑戦や快の体験' },
    intellectual: { name: '知的体験',     color: '#7986CB', desc: '学びや思考を通じた知の探求' },
    creative:     { name: '創造的体験',   color: '#FF8A65', desc: '新しいものを生み出す体験' },
    cultural:     { name: '文化的体験',   color: '#4DB6AC', desc: '異文化との接触・視野の拡大' },
    social:       { name: '社会的体験',   color: '#81C784', desc: 'チームや社会との関わり' },
    emotional:    { name: '感情的体験',   color: '#F06292', desc: '深い感動や感情の揺れ' },
    spiritual:    { name: '精神的体験',   color: '#9575CD', desc: '人生の意味や価値観の探求' },
    temporal:     { name: '時間的体験',   color: '#4FC3F7', desc: '時間の使い方や長期的な取り組み' },
    spatial:      { name: '空間的体験',   color: '#FFD54F', desc: '場所や環境の変化' },
    serendipity:  { name: '偶然的体験',   color: '#AED581', desc: '予期せぬ出来事や偶然の出会い' },
    natural:      { name: '自然的体験',   color: '#A1887F', desc: '自然との触れ合い' },
    economic:     { name: '経済的体験',   color: '#90A4AE', desc: '経済的な挑戦や決断' }
};

const charImgMap = {
    '沈黙の賢者': '1.png', '石の設計士': '2.png', '盲目の英雄': '3.png',
    '黄金の女王': '4.png', '異端の錬金術師': '5.png', '地図を持たない旅人': '6.png',
    '嵐の革命家': '7.png', '暴食の王': '8.png', '誓いの守護者': '9.png',
    '森の番人': '10.png', '鐘を鳴らす予言者': '11.png', '施しの商人': '12.png',
    '涙の吟遊詩人': '13.png', '微笑みの酒場主': '14.png', '夢追いの船長': '15.png',
    '仮面の道化師': '16.png'
};

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwNOCM1DMMRMMexb-zHfryomi4wCFSgH8f5eISSTuo6ZwJitX-2C9u8mXbMNzguXSzUfA/exec';

// フェードイン
const observer = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
}, { threshold: 0.1 });
document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

// データ取得
fetch(SCRIPT_URL)
    .then(res => res.json())
    .then(data => {
        // 累計人数
        document.getElementById('header-total').innerHTML = 
            '累計診断者数 <strong>' + data.total + '</strong> 人';

        // キャラクターランキング
        const charGrid = document.getElementById('char-grid');
        if (data.ranking && data.ranking.length > 0) {
            const maxPct = data.ranking[0].percentage;
            charGrid.innerHTML = data.ranking.map((item, i) => {
                const barW = maxPct > 0 ? Math.round((item.percentage / maxPct) * 100) : 0;
                return '<div class="char-row">'
                    + '<div class="char-rank">' + (i + 1) + '</div>'
                    + '<img class="char-img" src="' + (charImgMap[item.name] || '') + '" alt="' + item.name + '">'
                    + '<div class="char-info">'
                    + '<div class="char-name">' + item.name + '</div>'
                    + '<div class="char-bar-wrap"><div class="char-bar" data-w="' + barW + '"></div></div>'
                    + '</div>'
                    + '<div class="char-pct">' + item.percentage + '<span>%</span></div>'
                    + '</div>';
            }).join('');

            // バーアニメーション
            setTimeout(() => {
                charGrid.querySelectorAll('.char-bar').forEach(bar => {
                    bar.style.width = bar.dataset.w + '%';
                });
            }, 200);
        }

        // 12軸平均スコア
        const axisGrid = document.getElementById('axis-grid');
        if (data.axisAverages) {
            const axes = Object.keys(axisInfo);
            // 値でソート（高い順）
            const sorted = axes.filter(k => data.axisAverages[k] !== undefined)
                .map(k => ({ key: k, avg: data.axisAverages[k] }))
                .sort((a, b) => b.avg - a.avg);

            const maxAvg = sorted.length > 0 ? sorted[0].avg : 1;

            axisGrid.innerHTML = sorted.map(item => {
                const info = axisInfo[item.key];
                const barW = maxAvg > 0 ? Math.round((item.avg / maxAvg) * 100) : 0;
                return '<div class="axis-card">'
                    + '<div class="axis-top">'
                    + '<div class="axis-name">' + info.name + '</div>'
                    + '<div class="axis-avg">' + item.avg + '<span>%</span></div>'
                    + '</div>'
                    + '<div class="axis-bar-wrap"><div class="axis-bar" data-w="' + barW + '" style="background:' + info.color + '"></div></div>'
                    + '<div class="axis-desc">' + info.desc + '</div>'
                    + '</div>';
            }).join('');

            setTimeout(() => {
                axisGrid.querySelectorAll('.axis-bar').forEach(bar => {
                    bar.style.width = bar.dataset.w + '%';
                });
            }, 500);
        } else {
            axisGrid.innerHTML = '<div class="loading">12軸データはまだありません</div>';
        }

        // フェードイン再トリガー
        document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
    })
    .catch(err => {
        console.error('データ取得エラー:', err);
        document.getElementById('char-grid').innerHTML = '<div class="loading">データの取得に失敗しました</div>';
        document.getElementById('axis-grid').innerHTML = '<div class="loading">データの取得に失敗しました</div>';
    });
</script>
</body>
</html>
