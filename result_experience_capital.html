<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ExC CANVAS - みんなの体験資本</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Shippori+Mincho:wght@400;700&family=Cinzel:wght@400;700&display=swap');

        :root {
            --rose: #C85A7C;
            --rose-light: #F8E8ED;
            --rose-dark: #A04661;
            --text-main: #333;
            --text-sub: #666;
            --bg: #faf8f5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Shippori Mincho', serif;
            background: var(--bg);
            color: var(--text-main);
            line-height: 1.8;
            overflow-x: hidden;
        }

        /* ナビ */
        .top-nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 20px;
            background: rgba(250,248,245,0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }
        .top-nav-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem; color: var(--rose);
            text-decoration: none; font-weight: 600;
            letter-spacing: 0.1em;
        }
        .top-nav-right { display: flex; align-items: center; gap: 15px; }
        .top-nav-link { font-size: 0.75rem; color: var(--text-sub); text-decoration: none; }
        .top-nav-link:hover { color: var(--rose); }

        /* ヒーロー */
        .hero {
            padding: 120px 30px 60px;
            text-align: center;
            background: linear-gradient(180deg, var(--rose-light) 0%, var(--bg) 100%);
        }
        .hero-label {
            font-family: 'Cinzel', serif;
            font-size: 0.8rem; letter-spacing: 0.3em;
            color: var(--rose); margin-bottom: 12px;
        }
        .hero-title {
            font-size: 2rem; font-weight: 700;
            color: var(--text-main); margin-bottom: 10px;
        }
        .hero-count {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.5rem; font-weight: 700;
            color: var(--rose); line-height: 1.2;
        }
        .hero-count-label {
            font-size: 0.85rem; color: var(--text-sub);
        }

        /* セクション共通 */
        .section {
            max-width: 720px;
            margin: 0 auto;
            padding: 60px 25px;
        }
        .section-title {
            font-size: 1.3rem; font-weight: 700;
            color: var(--text-main); margin-bottom: 30px;
            text-align: center; letter-spacing: 0.08em;
        }
        .section-title::after {
            content: '';
            display: block; width: 40px; height: 2px;
            background: var(--rose);
            margin: 15px auto 0;
        }

        

        /* キャラクターランキング */
        .char-ranking { display: flex; flex-direction: column; gap: 12px; }
        .rank-item {
            display: flex; align-items: center; gap: 14px;
            background: #fff; border-radius: 14px; padding: 12px 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            border: 1px solid rgba(200,90,124,0.08);
            transition: transform 0.2s;
            cursor: pointer;
        }
        .rank-item:hover { transform: translateY(-2px); }
        .rank-item.top3 { border-left: 3px solid var(--rose); }
        .rank-num {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem; font-weight: 700; color: var(--rose);
            width: 28px; text-align: center; flex-shrink: 0;
        }
        .rank-img {
            width: 48px; height: 48px; border-radius: 50%;
            object-fit: cover; flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .rank-info { flex: 1; min-width: 0; }
        .rank-name { font-size: 0.85rem; font-weight: 700; color: var(--text-main); }
        .rank-bar-wrap { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
        .rank-bar-bg { flex: 1; height: 8px; background: #eee; border-radius: 4px; overflow: hidden; }
        .rank-bar-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--rose) 0%, #E8879F 100%); transition: width 1.5s cubic-bezier(0.25, 1, 0.5, 1); }
        .rank-stats {
            font-size: 0.7rem; color: var(--text-sub); white-space: nowrap;
        }
        .rank-count {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem; font-weight: 700; color: var(--rose);
        }

        /* CTA */
        .cta-section { text-align: center; padding: 60px 25px 80px; }
        .btn-cta {
            display: inline-block;
            background: linear-gradient(135deg, #F06292 0%, #D05A7C 100%);
            color: #fff; text-decoration: none; padding: 18px 50px;
            border-radius: 50px; font-family: 'Cinzel', serif;
            font-size: 1.1rem; letter-spacing: 0.1em;
            box-shadow: 0 8px 25px rgba(232,107,143,0.4); transition: all 0.3s;
        }
        .btn-cta:hover { transform: translateY(-3px); box-shadow: 0 12px 35px rgba(232,107,143,0.5); }
        .btn-cta-sub { display: block; font-family: 'Shippori Mincho', serif; font-size: 0.85rem; margin-top: 6px; font-weight: normal; }

        .footer { text-align: center; padding: 30px; font-size: 0.7rem; color: #999; }

        /* ローディング */
        .loading { text-align: center; padding: 80px 20px; color: var(--text-sub); }
        .loading-spinner { width: 40px; height: 40px; border: 3px solid #eee; border-top-color: var(--rose); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-msg { text-align: center; padding: 40px; color: #999; font-size: 0.9rem; }

        /* モバイル */
        @media (max-width: 768px) {
            .hero { padding: 100px 20px 40px; }
            .hero-title { font-size: 1.5rem; }
            .hero-count { font-size: 2.8rem; }
            .section { padding: 40px 18px; }
            .section-title { font-size: 1.1rem; }
            .rank-img { width: 40px; height: 40px; }
            .rank-name { font-size: 0.78rem; }
            .top-nav { padding: 10px 15px; }
            .top-nav-logo { font-size: 0.9rem; }
            .top-nav-link { font-size: 0.7rem; }
            .btn-cta { padding: 16px 40px; font-size: 1rem; }
        }
        @media (max-width: 480px) {
            .hero-title { font-size: 1.3rem; }
            .hero-count { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

<div class="top-nav">
    <a href="/" class="top-nav-logo">ExC CANVAS</a>
    <div class="top-nav-right">
        <a href="diagnosis.html" class="top-nav-link">診断する</a>
        <a href="/" class="top-nav-link">トップに戻る</a>
    </div>
</div>

<div class="hero">
    <div class="hero-label">EVERYONE'S EXPERIENCE CAPITAL</div>
    <h1 class="hero-title">みんなの体験資本</h1>
    <div id="totalCount" class="hero-count" style="display:none"></div>
    <div class="hero-count-label" style="display:none"></div>
</div>

<div id="content">
    <div class="loading" id="loadingArea">
        <div class="loading-spinner"></div>
        <div>統計データを読み込んでいます...</div>
    </div>
</div>

<div id="statsContent" style="display: none;">
    <div class="section">
        <div class="section-title">キャラクターランキング</div>
        <div class="char-ranking" id="charRanking"></div>
    </div>


    <div class="cta-section">
        <a href="diagnosis.html" class="btn-cta">
            DRAW YOUR STORY
            <span class="btn-cta-sub">体験資本の可視化をはじめる</span>
        </a>
    </div>
</div>

<div class="footer">© 2026 ExC CANVAS - Experience Capital Assessment</div>

<script>
// ================================
// Google Sheets から直接CSV取得
// ================================
const SHEET_ID = '1tayI4i3FW2gFqCNxfpR6kgJ3MbI6-GGPLWdJY3aQwjA';

// 列インデックス (A=0)
// A:タイムスタンプ B:キャラクター名 C:タイプキー D:性別 E:年齢層
// F:身体 G:知的 H:創造 I:文化 J:社会 K:感情 L:精神 M:時間 N:空間 O:偶然 P:自然 Q:経済
const COL = { character: 1 };

// キャラクター → 画像マッピング
const charImages = {
    '沈黙の賢者': '1.png', '石の設計士': '2.png', '盲目の英雄': '3.png',
    '黄金の女王': '4.png', '異端の錬金術師': '5.png', '地図を持たない旅人': '6.png',
    '嵐の革命家': '7.png', '暴食の王': '8.png', '誓いの守護者': '9.png',
    '森の番人': '10.png', '鐘を鳴らす予言者': '11.png', '施しの商人': '12.png',
    '涙の吟遊詩人': '13.png', '微笑みの酒場主': '14.png', '夢追いの船長': '15.png',
    '仮面の道化師': '16.png'
};
const charPages = {
    '沈黙の賢者': 'result_sage.html', '石の設計士': 'result_architect.html',
    '盲目の英雄': 'result_hero.html', '黄金の女王': 'result_queen.html',
    '異端の錬金術師': 'result_alchemist.html', '地図を持たない旅人': 'result_traveler.html',
    '嵐の革命家': 'result_rebel.html', '暴食の王': 'result_king.html',
    '誓いの守護者': 'result_guardian.html', '森の番人': 'result_keeper.html',
    '鐘を鳴らす予言者': 'result_prophet.html', '施しの商人': 'result_merchant.html',
    '涙の吟遊詩人': 'result_bard.html', '微笑みの酒場主': 'result_host.html',
    '夢追いの船長': 'result_captain.html', '仮面の道化師': 'result_jester.html'
};

async function loadStats() {
    try {
        // JSONP方式：scriptタグ経由でCORS回避
        const callbackName = '_gvizCallback_' + Date.now();
        
        const data = await new Promise((resolve, reject) => {
            const timeout = setTimeout(() => {
                reject(new Error('タイムアウト'));
                delete window[callbackName];
            }, 15000);
            
            window[callbackName] = function(response) {
                clearTimeout(timeout);
                delete window[callbackName];
                document.body.removeChild(script);
                resolve(response);
            };
            
            const script = document.createElement('script');
            script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${callbackName}`;
            script.onerror = () => {
                clearTimeout(timeout);
                reject(new Error('スクリプト読み込み失敗'));
            };
            document.body.appendChild(script);
        });
        
        if (!data.table || !data.table.rows || data.table.rows.length === 0) {
            document.getElementById('loadingArea').innerHTML = '<div class="error-msg">まだ診断データがありません。<br>最初の一人になりましょう！</div>';
            return;
        }
        
        // rows を単純な配列に変換
        const rows = data.table.rows.map(row => 
            row.c.map(cell => cell ? (cell.v !== null && cell.v !== undefined ? String(cell.v) : '') : '')
        );
        
        processData(rows);
    } catch (err) {
        console.error('データ取得エラー:', err);
        document.getElementById('loadingArea').innerHTML = '<div class="error-msg">データの読み込みに失敗しました。<br>しばらくしてからもう一度お試しください。</div>';
    }
}

function processData(rows) {
    const total = rows.length;


    // キャラクター
    const charMap = {};
    rows.forEach(r => { const n = r[COL.character] || '不明'; charMap[n] = (charMap[n] || 0) + 1; });

    renderStats({ totalCount: total, characterDistribution: charMap });
}

function renderStats(data) {
    // totalCount非表示



    // キャラクターランキング
    const rankEl = document.getElementById('charRanking');
    const chars = Object.entries(data.characterDistribution).sort((a, b) => b[1] - a[1]);
    const maxC = chars[0]?.[1] || 1;
    chars.forEach(([name, count], idx) => {
        const pct = ((count / data.totalCount) * 100).toFixed(1);
        const img = charImages[name] || '1.png';
        const page = charPages[name] || '#';
        const item = document.createElement('a');
        item.href = page;
        item.style.textDecoration = 'none';
        item.style.color = 'inherit';
        item.className = 'rank-item' + (idx < 3 ? ' top3' : '');
        item.innerHTML = `
            <div class="rank-num">${idx + 1}</div>
            <img class="rank-img" src="${img}" alt="${name}">
            <div class="rank-info">
                <div class="rank-name">${name}</div>
                <div class="rank-bar-wrap">
                    <div class="rank-bar-bg"><div class="rank-bar-fill" data-width="${(count/maxC)*100}"></div></div>
                    <div class="rank-stats">${pct}%</div>
                </div>
            </div>
        `;
        rankEl.appendChild(item);
    });

    document.getElementById('loadingArea').style.display = 'none';
    document.getElementById('statsContent').style.display = 'block';

    setTimeout(() => {
        document.querySelectorAll('[data-width]').forEach(bar => { bar.style.width = bar.dataset.width + '%'; });
    }, 100);
}

loadStats();
</script>
</body>
</html>
