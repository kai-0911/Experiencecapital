<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExC CANVAS - あなたの体験資本診断結果</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Noto+Serif+JP:wght@400;600;700&display=swap');

        :root {
            --primary: #C85A7C;
            --primary-dark: #A04661;
            --text-dark: #1a1a1a;
            --text-gray: #666;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        #paintCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
        }

        body {
            font-family: 'Noto Serif JP', serif;
            background: #ffffff;
            color: var(--text-dark);
            line-height: 1.9;
            position: relative;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 100px 30px;
            position: relative;
            z-index: 1;
        }

        /* ヘッダー：体験資本タイトル */
        .capital-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .capital-title {
            font-size: 1rem;
            color: var(--text-gray);
            letter-spacing: 0.2em;
            margin-bottom: 15px;
        }

        .capital-subtitle {
            font-size: 2.5rem;
            color: var(--primary);
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        /* キャラクター画像 */
        .character-image {
            text-align: center;
            margin-bottom: 40px;
        }

        .character-image img {
            width: 400px;
            height: 400px;
            object-fit: contain;
        }

        .character-name {
            text-align: center;
            margin-bottom: 70px;
        }

        .character-name-jp {
            font-size: 2.2rem;
            color: var(--text-dark);
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.05em;
        }

        .character-name-en {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            color: var(--text-gray);
            font-weight: 300;
            font-style: italic;
            letter-spacing: 0.1em;
        }

        /* 体験資本スコア */
        .capital-scores {
            background: #fafafa;
            padding: 40px 35px;
            border-radius: 10px;
            margin-bottom: 80px;
            border-top: 3px solid var(--primary);
        }

        .scores-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: 0.05em;
        }

        .score-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .score-item {
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e8e8e8;
        }

        .score-label {
            font-size: 0.9rem;
            color: var(--text-gray);
            margin-bottom: 10px;
            letter-spacing: 0.1em;
        }

        .score-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .score-bar {
            width: 100%;
            height: 8px;
            background: #e8e8e8;
            border-radius: 10px;
            margin-top: 12px;
            overflow: hidden;
        }

        .score-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--primary-dark) 100%);
            transition: width 1s ease-out;
        }

        /* 体験資本の重心 */
        .capital-focus {
            margin-bottom: 80px;
            text-align: center;
        }

        .focus-title {
            font-size: 1rem;
            color: var(--text-gray);
            margin-bottom: 25px;
            letter-spacing: 0.15em;
        }

        .focus-grid {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .focus-item {
            padding: 10px 24px;
            border-radius: 6px;
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .focus-spiritual { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .focus-material { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .focus-independent { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .focus-relational { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }

        /* コンテンツセクション */
        .content-section {
            margin-bottom: 70px;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 25px;
            letter-spacing: 0.05em;
            padding-left: 18px;
            border-left: 3px solid var(--primary);
            position: relative;
        }

        .section-title::before {
            content: '';
            position: absolute;
            left: -3px;
            top: -5px;
            width: 3px;
            height: calc(100% + 10px);
            background: linear-gradient(180deg, var(--primary) 0%, rgba(200, 90, 124, 0.3) 100%);
        }

        .section-content {
            font-size: 1rem;
            line-height: 2;
            color: var(--text-dark);
            white-space: pre-line;
        }

        /* 資本・副作用の横並び */
        .capital-sidebyside {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 70px;
        }

        .capital-sidebyside .content-section {
            margin-bottom: 0;
            padding: 30px;
            background: #fafafa;
            border-radius: 8px;
            border-top: 2px solid var(--primary);
        }

        /* アドバイスセクション */
        .advice-section {
            background: linear-gradient(135deg, #fff5f8 0%, #fef8fa 100%);
            padding: 45px 40px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            margin-bottom: 100px;
            box-shadow: 0 4px 20px rgba(200, 90, 124, 0.08);
            position: relative;
        }

        .advice-section::before {
            content: '💡';
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2rem;
            opacity: 0.3;
        }

        .advice-section .section-title {
            color: var(--primary);
            border-left: none;
            padding-left: 0;
        }

        .advice-section .section-title::before {
            display: none;
        }

        .advice-section .section-content {
            font-weight: 500;
            font-size: 1.05rem;
        }

        @media (max-width: 768px) {
            .container { padding: 60px 20px; }
            .character-image img { width: 300px; height: 300px; }
            .capital-subtitle { font-size: 2rem; }
            .score-grid { grid-template-columns: 1fr; }
            .capital-sidebyside { grid-template-columns: 1fr; gap: 50px; }
        }
    </style>
</head>
<body>

<canvas id="paintCanvas"></canvas>

<div class="container">
    <!-- 体験資本タイトル -->
    <div class="capital-header">
        <div class="capital-title">YOUR EXPERIENCE CAPITAL</div>
        <div class="capital-subtitle">あなたの体験資本</div>
    </div>

    <!-- キャラクター -->
    <div class="character-image">
        <img id="char-img" src="1_sage.png" alt="キャラクター">
    </div>

    <div class="character-name">
        <div class="character-name-jp" id="char-name-jp">沈黙の賢者</div>
        <div class="character-name-en" id="char-name-en">The Silent Sage</div>
    </div>

    <!-- 体験資本スコア -->
    <div class="capital-scores">
        <div class="scores-title">体験資本スコア</div>
        <div class="score-grid">
            <div class="score-item">
                <div class="score-label">精神資本</div>
                <div class="score-value" id="score-spiritual">0</div>
                <div class="score-bar"><div class="score-fill" id="bar-spiritual"></div></div>
            </div>
            <div class="score-item">
                <div class="score-label">物質資本</div>
                <div class="score-value" id="score-material">0</div>
                <div class="score-bar"><div class="score-fill" id="bar-material"></div></div>
            </div>
            <div class="score-item">
                <div class="score-label">独立資本</div>
                <div class="score-value" id="score-independent">0</div>
                <div class="score-bar"><div class="score-fill" id="bar-independent"></div></div>
            </div>
            <div class="score-item">
                <div class="score-label">関係資本</div>
                <div class="score-value" id="score-relational">0</div>
                <div class="score-bar"><div class="score-fill" id="bar-relational"></div></div>
            </div>
        </div>
    </div>

    <!-- 体験資本の重心 -->
    <div class="capital-focus">
        <div class="focus-title">あなたの体験資本の重心</div>
        <div class="focus-grid" id="focus-grid"></div>
    </div>

    <!-- 体験資本プロファイル -->
    <div class="content-section">
        <div class="section-title">あなたの体験資本プロファイル</div>
        <div class="section-content" id="personality"></div>
    </div>

    <!-- 蓄積された資本・副作用 -->
    <div class="capital-sidebyside">
        <div class="content-section">
            <div class="section-title">蓄積された体験資本</div>
            <div class="section-content" id="strength"></div>
        </div>
        <div class="content-section">
            <div class="section-title">資本の副作用</div>
            <div class="section-content" id="weakness"></div>
        </div>
    </div>

    <!-- 体験の傾向 -->
    <div class="content-section">
        <div class="section-title">体験資本の蓄積パターン</div>
        <div class="section-content" id="tendency"></div>
    </div>

    <!-- 資本形成に影響を与えた体験 -->
    <div class="content-section">
        <div class="section-title">資本形成に影響を与えた体験</div>
        <div class="section-content" id="impactful-exp"></div>
    </div>

    <!-- 不足している体験資本 -->
    <div class="content-section">
        <div class="section-title">不足している体験資本</div>
        <div class="section-content" id="lacking-exp"></div>
    </div>

    <!-- 資本ポートフォリオの課題 -->
    <div class="content-section">
        <div class="section-title">体験資本ポートフォリオの課題</div>
        <div class="section-content" id="life-challenge"></div>
    </div>

    <!-- 次に積むべき体験資本 -->
    <div class="content-section advice-section">
        <div class="section-title">次に積むべき体験資本</div>
        <div class="section-content" id="advice"></div>
    </div>
</div>

<script>
