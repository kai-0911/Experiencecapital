<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ExC CANVAS - 診断</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Shippori+Mincho:wght@400;700&display=swap');

        :root { --rose: #C85A7C; }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Shippori Mincho', serif;
            background: #faf7f3;
            color: #333;
            overflow: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* 背景キャンバス */
        #canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        /* トップナビ */
        .top-nav {
            position: fixed; top: 0; left: 0; right: 0;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .top-nav-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem; color: var(--rose);
            text-decoration: none; letter-spacing: 0.15em;
            font-weight: 600; opacity: 0.7;
        }
        .top-nav-home {
            font-size: 0.75rem; color: #666;
            text-decoration: none;
        }
        .top-nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .top-nav-back {
            font-size: 0.75rem;
            color: var(--rose);
            background: none;
            border: 1px solid var(--rose);
            border-radius: 15px;
            padding: 4px 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .top-nav-back:hover {
            background: var(--rose);
            color: #fff;
        }

        /* プログレス */
        .progress-area {
            position: fixed; top: 42px; left: 0; right: 0;
            z-index: 999;
            padding: 8px 20px 6px;
            background: rgba(250,247,243,0.95);
        }
        .progress-bar {
            width: 100%; max-width: 400px;
            height: 3px; background: #eee;
            border-radius: 2px; margin: 0 auto 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--rose), #e88aaa);
            border-radius: 2px;
            transition: width 0.5s ease;
        }

        /* メインエリア */
        .main {
            position: relative;
            z-index: 10;
            padding-top: 80px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* スワイプエリア */
        .swipe-area {
            position: relative;
            width: 100%; max-width: 420px;
            height: 400px;
            margin: 0 auto;
        }

        /* 方向ヒント */
        .hint {
            position: absolute;
            font-size: 0.7rem;
            font-weight: 600;
            opacity: 0.25;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 0;
        }
        .hint.left { left: 12px; top: 50%; transform: translateY(-50%); color: #777; }
        .hint.right { right: 12px; top: 50%; transform: translateY(-50%); color: var(--rose); }
        .hint.active { opacity: 0.9; }

        /* カード */
        .card {
            position: absolute;
            top: 25px; left: 50%;
            transform: translateX(-50%);
            width: 300px; height: 350px;
            background: #fff;
            border-radius: 22px;
            box-shadow: 0 6px 30px rgba(0,0,0,0.07);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 35px 28px;
            cursor: grab;
            user-select: none;
            touch-action: none;
            z-index: 10;
        }
        .card:active { cursor: grabbing; }

        .card .question {
            font-size: 0.85rem;
            line-height: 2;
            color: #444;
            text-align: center;
        }

        /* 2択カード（タイプ判定用） */
        .card .type-question {
            font-size: 0.85rem;
            color: #555;
            text-align: center;
            margin-bottom: 25px;
        }
        .card .type-choices {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 15px;
        }
        .card .type-choice {
            flex: 1;
            text-align: center;
            font-size: 0.85rem;
            line-height: 1.7;
            color: #555;
            padding: 12px 8px;
            border-radius: 12px;
            transition: background 0.2s;
        }
        .card .type-choice.left-choice { background: #f5f5f5; }
        .card .type-choice.right-choice { background: #C85A7C0D; }
        .card .choice-arrow {
            font-size: 0.7rem;
            color: #777;
            margin-bottom: 4px;
        }

        /* オーバーレイバッジ */
        .overlay {
            position: absolute;
            pointer-events: none;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.1s;
        }
        .overlay .badge {
            padding: 6px 18px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 0.08em;
        }
        .overlay.right { top: 45px; right: 35px; }
        .overlay.right .badge {
            background: #C85A7C15; color: var(--rose);
            border: 2px solid var(--rose);
            transform: rotate(12deg);
        }
        .overlay.left { top: 45px; left: 35px; }
        .overlay.left .badge {
            background: #f0f0f0; color: #666;
            border: 2px solid #ccc;
            transform: rotate(-12deg);
        }

        /* ボタン */
        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 15px;
        }
        .btn-wrap { display: flex; flex-direction: column; align-items: center; }
        .btn {
            border-radius: 50%;
            border: 2px solid;
            background: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .btn:hover { transform: scale(1.12); }
        .btn.no { width: 50px; height: 50px; border-color: #ddd; color: #777; font-size: 1.2rem; }
        .btn.no:hover { background: #f5f5f5; }
        .btn.yes { width: 50px; height: 50px; border-color: var(--rose); color: var(--rose); font-size: 1.2rem; }
        .btn.yes:hover { background: var(--rose); color: #fff; }
        .btn-label { font-size: 0.5rem; color: #555; margin-top: 3px; max-width: 80px; text-align: center; line-height: 1.3; }

        /* 属性質問 */
        .demographics {
            display: none;
            max-width: 400px;
            margin: 0 auto;
            padding: 30px 20px;
            text-align: center;
        }
        .demographics.active { display: block; }
        .demo-title {
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 25px;
        }
        .demo-group {
            margin-bottom: 20px;
        }
        .demo-group label {
            display: block;
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 8px;
        }
        .demo-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .demo-opt {
            padding: 8px 16px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
            background: #fff;
        }
        .demo-opt:hover { border-color: var(--rose); color: var(--rose); }
        .demo-opt.selected {
            background: var(--rose);
            color: #fff;
            border-color: var(--rose);
        }
        .demo-submit {
            margin-top: 25px;
            padding: 12px 40px;
            background: var(--rose);
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 0.9rem;
            cursor: pointer;
            opacity: 0.4;
            transition: all 0.3s;
        }
        .demo-submit.ready { opacity: 1; }
        .demo-submit.ready:hover { transform: scale(1.05); }

        /* キャラクター出現 */
        .character-reveal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 2000;
            background: rgba(250,247,243,0.98);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .character-reveal.active { display: flex; }
        .character-reveal img {
            width: 220px; height: 220px;
            object-fit: contain;
            margin-bottom: 20px;
            animation: fadeInUp 0.8s ease;
        }
        .character-reveal .name {
            font-family: 'Shippori Mincho', serif;
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 10px;
            animation: fadeInUp 0.8s ease 0.2s both;
        }
        .character-reveal .name-en {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.9rem;
            color: #666;
            letter-spacing: 0.1em;
            margin-bottom: 30px;
            animation: fadeInUp 0.8s ease 0.3s both;
        }
        .character-reveal .go-btn {
            padding: 14px 50px;
            background: var(--rose);
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            animation: fadeInUp 0.8s ease 0.5s both;
            transition: transform 0.2s;
        }
        .character-reveal .go-btn:hover { transform: scale(1.05); }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* スワイプガイド */
        .swipe-guide {
            display: flex;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 3000;
        }
        .swipe-guide.hidden { display: none; }
        .guide-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
        }
        .guide-content {
            position: relative;
            z-index: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .guide-card {
            background: #fff;
            border-radius: 22px;
            padding: 40px 30px;
            text-align: center;
            max-width: 300px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        .guide-arrows {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            height: 60px;
            margin-bottom: 10px;
        }
        .guide-arrow {
            font-size: 0.9rem;
            font-weight: 600;
        }
        .guide-arrow.left {
            color: #81C784;
            animation: guideLeft 2s ease-in-out infinite;
        }
        .guide-arrow.right {
            color: #E57373;
            animation: guideRight 2s ease-in-out infinite 0.3s;
        }
        .guide-hand {
            font-size: 2rem;
            margin-bottom: 15px;
            animation: guideSwipe 2s ease-in-out infinite;
        }
        .guide-text {
            font-size: 1rem;
            color: #444;
            margin-bottom: 6px;
        }
        .guide-sub {
            font-size: 0.75rem;
            color: #666;
            margin-bottom: 25px;
        }
        .guide-start {
            padding: 12px 40px;
            background: var(--rose);
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .guide-start:hover { transform: scale(1.05); }

        @keyframes guideSwipe {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(30px); }
            50% { transform: translateX(0); }
            75% { transform: translateX(-30px); }
        }
        @keyframes guideLeft {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
        @keyframes guideRight {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        @media (max-width: 420px) {
            .card { width: 280px; height: 330px; padding: 30px 22px; }
            .swipe-area { height: 380px; }
            .card .question { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<div class="top-nav">
    <a href="/" class="top-nav-logo">ExC CANVAS</a>
    <div class="top-nav-right">
        <button class="top-nav-back" id="backBtn" onclick="goBack()" style="display:none;">← 戻る</button>
        <a href="/" class="top-nav-home">トップに戻る</a>
    </div>
</div>

<div class="progress-area">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</div>

<canvas id="canvas"></canvas>

<div class="main" id="mainArea">
    <div class="swipe-area" id="swipeArea">
        <div class="hint left" id="hintLeft">← ない</div>
        <div class="hint right" id="hintRight">ある →</div>

        <div class="overlay right" id="overlayRight"><div class="badge">ある</div></div>
        <div class="overlay left" id="overlayLeft"><div class="badge">ない</div></div>

        <div class="card" id="card">
            <div class="question" id="questionText"></div>
        </div>
    </div>

    <div class="buttons" id="buttons2">
        <div class="btn-wrap">
            <button class="btn no" onclick="doAnswer(0,'left')">✕</button>
            <div class="btn-label" id="btn2Left">ない</div>
        </div>
        <div class="btn-wrap">
            <button class="btn yes" onclick="doAnswer(1,'right')">○</button>
            <div class="btn-label" id="btn2Right">ある</div>
        </div>
    </div>

    <div class="demographics" id="demographics">
        <div class="demo-title">最後に、あなたについて教えてください</div>
        <div class="demo-group">
            <label>年齢</label>
            <div class="demo-options" id="ageOptions">
                <div class="demo-opt" onclick="selectDemo('age',this)">〜19歳</div>
                <div class="demo-opt" onclick="selectDemo('age',this)">20代</div>
                <div class="demo-opt" onclick="selectDemo('age',this)">30代</div>
                <div class="demo-opt" onclick="selectDemo('age',this)">40代</div>
                <div class="demo-opt" onclick="selectDemo('age',this)">50代〜</div>
            </div>
        </div>
        <div class="demo-group">
            <label>性別</label>
            <div class="demo-options" id="genderOptions">
                <div class="demo-opt" onclick="selectDemo('gender',this)">男性</div>
                <div class="demo-opt" onclick="selectDemo('gender',this)">女性</div>
                <div class="demo-opt" onclick="selectDemo('gender',this)">その他/回答しない</div>
            </div>
        </div>
        <button class="demo-submit" id="demoSubmit" onclick="submitAll()">結果を見る</button>
    </div>
</div>

<div class="swipe-guide" id="swipeGuide">
    <div class="guide-overlay"></div>
    <div class="guide-content">
        <div class="guide-card">
            <div class="guide-arrows">
                <div class="guide-arrow left">← ない</div>
                <div class="guide-arrow right">ある →</div>
            </div>
            <div class="guide-hand">👆</div>
            <div class="guide-text">カードを左右にスワイプして回答</div>
            <div class="guide-sub">ボタンでも回答できます</div>
            <button class="guide-start" onclick="dismissGuide()">はじめる</button>
        </div>
    </div>
</div>

<div class="character-reveal" id="reveal">
    <img id="revealImg" src="">
    <div class="name" id="revealName"></div>
    <div class="name-en" id="revealNameEn"></div>
    <button class="go-btn" onclick="goToResult()">詳しく見る →</button>
</div>

<script>
// ===========================
// 質問データ
// ===========================

// 体験資本 36問（2択スワイプ: 0=ない, 1=ある）
const capitalQuestions = [
    // 身体的体験
    { q: "スポーツや運動、ダンスなどで\n大会に出たり、毎日練習するほど\nのめり込んだ経験はありますか？", axis: "physical" },
    { q: "忘れられないほど\n体力の限界に挑んだ\n経験はありますか？", axis: "physical" },
    { q: "「あの味が忘れられない」と\n今でも思い出す食事や、あるいは\n鳥肌が立つほどの音楽体験はありますか？", axis: "physical" },
    // 知的体験
    { q: "寝食を忘れるほど、\n学びや研究に没頭した\n経験はありますか？", axis: "intellectual" },
    { q: "難しい問題・概念について熟考した結果、\n深く理解できた時の喜びを\n経験したことはありますか？", axis: "intellectual" },
    { q: "専門書を読んだり人に会いに行くなど、\n一つのテーマを徹底的に\n追究した経験はありますか？", axis: "intellectual" },
    // 創造的体験
    { q: "自発的に何か新しいもの\n（企画、作品、アイデアなど）を\n形にした経験はありますか？", axis: "creative" },
    { q: "映画・音楽・絵画などで、\nしばらく頭から離れないほど\n心を奪われた作品はありますか？", axis: "creative" },
    { q: "自分なりの工夫やアレンジで、\n周囲に驚かれたり\n評価された経験はありますか？", axis: "creative" },
    // 文化的体験
    { q: "異なる文化や価値観に触れて、\n自分の常識が揺さぶられた\n経験はありますか？", axis: "cultural" },
    { q: "海外や異なる文化圏で\n一定期間暮らした\n経験はありますか？", axis: "cultural" },
    { q: "自分のルーツや育った文化について\n深く考えたり、知ろうとした\n経験はありますか？", axis: "cultural" },
    // 社会的体験
    { q: "自分の役割がチームや社会に\n確かに貢献していると\n強く実感した経験はありますか？", axis: "social" },
    { q: "チームで大きなことを\n成し遂げた\n経験はありますか？", axis: "social" },
    { q: "学校や職場以外で、\n自発的にコミュニティに\n参加した経験はありますか？", axis: "social" },
    // 感情的体験
    { q: "怒り・悲しみ・不安などの感情に圧倒され、\n自分と深く向き合わざるを得なかった\n経験はありますか？", axis: "emotional" },
    { q: "人生のどん底のような\n絶望を経験した\nことはありますか？", axis: "emotional" },
    { q: "涙が止まらないほどの感動や、\n心が震えるような体験を\nしたことはありますか？", axis: "emotional" },
    // 精神的体験
    { q: "人生や生きる意味について\n真剣に向き合った\n経験はありますか？", axis: "spiritual" },
    { q: "大切な人との死別や離別が、\n自分の生き方に大きな影響を\n与えた経験はありますか？", axis: "spiritual" },
    { q: "瞑想・祈り・内省など、\n静かに自分と向き合う時間を\n持ったことはありますか？", axis: "spiritual" },
    // 時間的体験
    { q: "長い年月をかけて\n何かを達成した\n経験はありますか？", axis: "temporal" },
    { q: "あえて遠回りや寄り道をしたことが、\n結果的に自分の財産になった\n経験はありますか？", axis: "temporal" },
    { q: "「あの経験がなければ今の自分はいない」\nと思えるような\n成長体験はありますか？", axis: "temporal" },
    // 空間的体験
    { q: "住む場所や環境が\n大きく変わった\n経験はありますか？", axis: "spatial" },
    { q: "一人旅で、まったく知らない土地に\n飛び込んだ\n経験はありますか？", axis: "spatial" },
    { q: "ある場所での体験が忘れられず、\n何度も足を運んだ\n経験はありますか？", axis: "spatial" },
    // 偶然的体験
    { q: "予期せぬ出来事がきっかけで、\n人生が大きく動いた\n経験はありますか？", axis: "serendipity" },
    { q: "たまたま隣にいた人、たまたま見た情報など、\n偶然の出会いがその後の人生に\n繋がった経験はありますか？", axis: "serendipity" },
    { q: "予定が狂ったおかげで、\nむしろ良い結果になった\n経験はありますか？", axis: "serendipity" },
    // 自然的体験
    { q: "自然の中で、人生観が変わるほどの\n圧倒的な景色や体験に\n出会ったことはありますか？", axis: "natural" },
    { q: "台風・地震・大雪など、\n自然の脅威を身をもって\n体験したことはありますか？", axis: "natural" },
    { q: "動物や植物を育てることに、\n深く心を満たされた\n経験はありますか？", axis: "natural" },
    // 経済的体験
    { q: "お金について強く不安を\n感じたことは\nありますか？", axis: "economic" },
    { q: "大きな経済的決断\n（投資、転職、起業、家の購入など）を\nした経験はありますか？", axis: "economic" },
    { q: "お金の使い方で、\n大きな後悔または大きな満足を\n感じた経験はありますか？", axis: "economic" },
];

// タイプ判定 12問（2方向スワイプ: 0=左, 1=右）
const typeQuestions = [
    // 内向 ⇔ 外向
    { q: "これまでの人生で、\nよりエネルギーを得てきたのは？", left: "一人の静かな時間", right: "人と過ごす時間", typeAxis: "ie" },
    { q: "困難な問題に直面した時、\nこれまでより多く選んできた方法は？", left: "まず一人で考える", right: "まず誰かに相談する", typeAxis: "ie" },

// 現在の質問がどのフェーズか
function getPhase() {
    if (currentIndex < capitalQuestions.length) return 'capital';
    if (currentIndex < capitalQuestions.length + typeQuestions.length) return 'type';
    return 'demographics';
}

function getCurrentQuestion() {
    if (getPhase() === 'capital') return capitalQuestions[currentIndex];
    if (getPhase() === 'type') return typeQuestions[currentIndex - capitalQuestions.length];
    return null;
}

// ===========================
// 水彩キャンバス
// ===========================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const splashColors = [
    '#E8B4B8', '#B8D4E3', '#F5D5A0', '#C8E6C9',
    '#D1C4E9', '#FFCCBC', '#B2DFDB', '#F8BBD0',
    '#DCEDC8', '#FFE0B2', '#E1BEE7', '#B3E5FC'
];

function paintSplash(color) {
    const x = Math.random() * canvas.width;
    const y = Math.random() * canvas.height;
    const size = 80 + Math.random() * 200;
    ctx.globalAlpha = 0.2 + Math.random() * 0.15;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fill();
    for (let i = 0; i < 2; i++) {
        const ox = (Math.random() - 0.5) * 200;
        const oy = (Math.random() - 0.5) * 200;
        ctx.globalAlpha = 0.12;
        ctx.beginPath();
        ctx.arc(x + ox, y + oy, 30 + Math.random() * 60, 0, Math.PI * 2);
        ctx.fill();
    }
}

function showQuestion() {
    const phase = getPhase();
    
    if (phase === 'demographics') {
        document.getElementById('swipeArea').style.display = 'none';
        document.getElementById('buttons2').style.display = 'none';
        document.getElementById('demographics').classList.add('active');
        return;
    }

    const q = getCurrentQuestion();
    const card = document.getElementById('card');
    document.getElementById('buttons2').style.display = 'flex';
    
    if (phase === 'capital') {
        document.getElementById('hintLeft').textContent = '← ない';
        document.getElementById('hintRight').textContent = 'ある →';
        document.getElementById('overlayLeft').querySelector('.badge').textContent = 'ない';
        document.getElementById('overlayRight').querySelector('.badge').textContent = 'ある';
        document.getElementById('btn2Left').textContent = 'ない';
        document.getElementById('btn2Right').textContent = 'ある';
        
        card.innerHTML = `<div class="question">${q.q.replace(/\n/g, '<br>')}</div>`;
    } else {
        document.getElementById('hintLeft').textContent = '← ' + q.left.substring(0, 8);
        document.getElementById('hintRight').textContent = q.right.substring(0, 8) + ' →';
        document.getElementById('overlayLeft').querySelector('.badge').textContent = q.left;
        document.getElementById('overlayRight').querySelector('.badge').textContent = q.right;
        document.getElementById('btn2Left').textContent = q.left;
        document.getElementById('btn2Right').textContent = q.right;

    updateProgress();

}

// ===========================
// スワイプ操作
// ===========================
let startX = 0, startY = 0, moveX = 0, moveY = 0, dragging = false;

function initSwipe() {
    const card = document.getElementById('card');
    card.style.transform = 'translateX(-50%)';
    card.style.opacity = '1';
    
    card.onpointerdown = (e) => {
        if (isAnimating) return;
        dragging = true;
        startX = e.clientX;
        startY = e.clientY;
        moveX = 0; moveY = 0;
        card.style.transition = 'none';
        card.setPointerCapture(e.pointerId);
    };
    
    card.onpointermove = (e) => {
        if (!dragging || isAnimating) return;
        moveX = e.clientX - startX;
        moveY = e.clientY - startY;
        const rot = moveX * 0.05;
        card.style.transform = `translateX(calc(-50% + ${moveX}px)) translateY(${moveY}px) rotate(${rot}deg)`;
        
        const oR = document.getElementById('overlayRight');
        const oL = document.getElementById('overlayLeft');
        oR.style.opacity = 0; oL.style.opacity = 0;
        
        const absX = Math.abs(moveX);
        
        if (moveX > 40) {
            oR.style.opacity = Math.min((moveX - 40) / 60, 1);
        } else if (moveX < -40) {
            oL.style.opacity = Math.min((-moveX - 40) / 60, 1);
        }
        
        // ヒントハイライト
        document.getElementById('hintLeft').classList.toggle('active', moveX < -40);
        document.getElementById('hintRight').classList.toggle('active', moveX > 40);
    };
    
    card.onpointerup = () => {
        if (!dragging || isAnimating) return;
        dragging = false;
        const absX = Math.abs(moveX);
        const threshold = 80;
        
        if (moveX > threshold) {
            flyOut(600, 0, 1);
        } else if (moveX < -threshold) {
            flyOut(-600, 0, 0);
        } else {
            card.style.transition = 'transform 0.3s ease';
            card.style.transform = 'translateX(-50%)';
            resetOverlays();
        }
    };
}

function flyOut(x, y, score) {
    isAnimating = true;
    const card = document.getElementById('card');
    card.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
    card.style.transform = `translateX(calc(-50% + ${x}px)) translateY(${y}px) rotate(${x * 0.04}deg)`;
    card.style.opacity = '0';
    
    paintSplash(splashColors[Math.floor(Math.random() * splashColors.length)]);
    
    setTimeout(() => processAnswer(score), 280);
}

function doAnswer(score, dir) {
    if (isAnimating) return;
    const targets = { left: [-500, 0], right: [500, 0] };
    const [x, y] = targets[dir];
    flyOut(x, y, score);
}

function resetOverlays() {
    ['overlayRight', 'overlayLeft'].forEach(id => {
        document.getElementById(id).style.opacity = 0;
    });
    ['hintLeft', 'hintRight'].forEach(id => {
        document.getElementById(id).classList.remove('active');
    });
}

function processAnswer(score) {
    answers[currentIndex] = score;
    currentIndex++;
    resetOverlays();
    
    const card = document.getElementById('card');
    card.style.transition = 'none';
    card.style.transform = 'translateX(-50%) scale(0.85)';
    card.style.opacity = '0';
    
    setTimeout(() => {
        showQuestion();
        updateBackButton();
        if (getPhase() !== 'demographics') {
            requestAnimationFrame(() => {
                card.style.transition = 'transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.25s ease';
                card.style.transform = 'translateX(-50%) scale(1)';
                card.style.opacity = '1';
                isAnimating = false;
            });
        } else {
            isAnimating = false;
        }
    }, 80);
}

function calculateResult() {
    // 体験資本スコア
    const capitalScores = {
        physical: 0, intellectual: 0, creative: 0, cultural: 0,
        social: 0, emotional: 0, spiritual: 0, temporal: 0,
        spatial: 0, serendipity: 0, natural: 0, economic: 0
    };
    
    for (let i = 0; i < capitalQuestions.length; i++) {
        const axis = capitalQuestions[i].axis;
        const score = answers[i] || 0;
        capitalScores[axis] += score;
    }
    
    // タイプ判定（3問多数決）
    const typeScores = { ie: 0, of: 0, sm: 0, ir: 0 };
    const typeBase = capitalQuestions.length;
    
    for (let i = 0; i < typeQuestions.length; i++) {
        const tAxis = typeQuestions[i].typeAxis;
        typeScores[tAxis] += answers[typeBase + i] || 0;
    }
    
    // 3問中2問以上が1（右）→ 外向/自由/物質/共鳴
    const is_introvert = typeScores.ie < 2;   // 0 or 1 → introvert
    const is_order = typeScores.of < 2;        // 0 or 1 → order
    const is_spirit = typeScores.sm < 2;       // 0 or 1 → spirit
    const is_independent = typeScores.ir < 2;  // 0 or 1 → independent
    
    const typeKey = `${is_introvert ? 'introvert' : 'extrovert'}_${is_order ? 'order' : 'freedom'}_${is_independent ? 'independent' : 'relation'}_${is_spirit ? 'spirit' : 'material'}`;
    
    const typeName = typeMappingNew[typeKey] || "沈黙の賢者";
    
    console.log('Type scores:', typeScores);
    console.log('Type key:', typeKey);
    console.log('Type name:', typeName);
    
    return {
        capitalScores,
        typeName,
        typeKey,
        gender: demoData.gender || 'Unknown',
        ageGroup: demoData.age || 'Unknown',
        result: typeInfo[typeName] ? { name: typeName, nameEn: typeInfo[typeName].nameEn, img: typeInfo[typeName].img } : null
    };
}

function submitAll() {
    if (!demoData.age || !demoData.gender) return;
    
    const resultData = calculateResult();
    sendToGoogleSheets(resultData);
    
    // キャラ出現
    const info = typeInfo[resultData.typeName];
    document.getElementById('revealImg').src = info.img;
    document.getElementById('revealName').textContent = resultData.typeName;
    document.getElementById('revealNameEn').textContent = info.nameEn;
    document.getElementById('reveal').classList.add('active');
}

function sendToGoogleSheets(data) {
    const scores = data.capitalScores;
    const total = Object.values(scores).reduce((s, v) => s + v, 0);
    if (total === 0) return;
    
    const axes = ['physical','intellectual','creative','cultural','social','emotional','spiritual','temporal','spatial','serendipity','natural','economic'];
    const rawPct = {};
    axes.forEach(a => rawPct[a] = (scores[a] / total) * 100);
    
    const floored = {};
    axes.forEach(a => floored[a] = Math.floor(rawPct[a]));
    
    let sum = axes.reduce((s, a) => s + floored[a], 0);
    const remainders = axes.map(a => ({ a, r: rawPct[a] - floored[a] })).sort((a, b) => b.r - a.r);
    let i = 0;
    while (sum < 100 && i < remainders.length) { floored[remainders[i].a]++; sum++; i++; }
    
    const ua = navigator.userAgent;
    let device = 'PC';
    if (/iPhone|iPad|iPod/i.test(ua)) device = 'iOS';
    else if (/Android/i.test(ua)) device = 'Android';
    
    const payload = {
        characterName: data.typeName,
        typeKey: data.typeKey,
        gender: data.gender,
        ageGroup: data.ageGroup,
        ...Object.fromEntries(axes.map(a => [a, floored[a]])),
        device,
        elapsedSeconds: Math.round((Date.now() - diagnosisStartTime) / 1000)
    };
    
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwNOCM1DMMRMMexb-zHfryomi4wCFSgH8f5eISSTuo6ZwJitX-2C9u8mXbMNzguXSzUfA/exec';
    fetch(SCRIPT_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    }).catch(err => console.error('送信エラー:', err));
}

function goToResult() {
    const resultData = calculateResult();
    const page = characterFiles[resultData.typeName] || 'result_sage.html';
    const params = new URLSearchParams();
    Object.entries(resultData.capitalScores).forEach(([k, v]) => params.append(k, v));
    window.location.href = page + '?' + params.toString();
}
