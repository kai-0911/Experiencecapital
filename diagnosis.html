<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ExC CANVAS - 診断</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Shippori+Mincho:wght@400;700&display=swap');

        :root { --rose: #C85A7C; --rose-light: #F8E8ED; --bg: #faf7f3; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { overflow-x: hidden; }

        body {
            font-family: 'Shippori Mincho', serif;
            background: var(--bg);
            color: #333;
            min-height: 100dvh;
            overflow-x: hidden;
            width: 100%;
        }

        /* ===== ナビ ===== */
        .nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            background: rgba(250,247,243,0.95);
            backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 16px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .nav-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.9rem; color: var(--rose);
            text-decoration: none; font-weight: 600;
            letter-spacing: 0.12em; opacity: 0.8;
        }
        .nav-right { display: flex; gap: 10px; align-items: center; }
        .nav-back {
            font-size: 0.7rem; color: var(--rose);
            background: none; border: 1px solid var(--rose);
            border-radius: 14px; padding: 3px 10px;
            cursor: pointer; transition: all 0.2s;
        }
        .nav-back:hover { background: var(--rose); color: #fff; }
        .nav-home { font-size: 0.7rem; color: #888; text-decoration: none; }

        /* ===== プログレス ===== */
        .progress-wrap {
            position: fixed; top: 41px; left: 0; right: 0; z-index: 99;
            background: rgba(250,247,243,0.95);
            padding: 8px 16px 6px;
        }
        .progress-bar {
            width: 100%; height: 3px; background: #e8e4df;
            border-radius: 2px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--rose), #e88aaa);
            border-radius: 2px; transition: width 0.4s ease;
        }
        .progress-text {
            text-align: center; font-size: 0.65rem; color: #aaa;
            margin-top: 3px;
        }

        /* ===== 質問エリア ===== */
        .question-area {
            padding: 75px 20px 30px;
            min-height: 100dvh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            width: 100%;
        }

        .q-card {
            width: 100%; max-width: 360px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            padding: 28px 16px 22px;
            text-align: center;
            animation: cardIn 0.3s ease-out;
            overflow: hidden;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .q-section-label {
            font-size: 0.6rem; color: var(--rose);
            letter-spacing: 0.15em; margin-bottom: 16px;
            font-weight: 600;
        }

        .q-text {
            font-size: 0.9rem; line-height: 1.95;
            color: #444; margin-bottom: 28px;
            white-space: pre-line;
        }

        /* ===== 3択トグル ===== */
        .toggle-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px; width: 100%;
        }
        .toggle-3 .t-btn {
            padding: 12px 2px;
            border: 2px solid #e8e4df;
            border-radius: 12px;
            background: #fff;
            cursor: pointer;
            transition: all 0.15s;
            display: flex; flex-direction: column;
            align-items: center; gap: 4px;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }
        .toggle-3 .t-btn:active { transform: scale(0.95); }
        .t-btn .t-icon { font-size: 1.1rem; line-height: 1; }
        .t-btn .t-label { font-size: 0.65rem; color: #888; line-height: 1.3; font-weight: 600; }

        .t-btn.t-no.selected { border-color: #aaa; background: #f5f5f5; }
        .t-btn.t-no.selected .t-label { color: #555; }
        .t-btn.t-no.selected .t-icon { color: #555; }

        .t-btn.t-maybe.selected { border-color: #e0b870; background: #fdf6e8; }
        .t-btn.t-maybe.selected .t-label { color: #b8943e; }
        .t-btn.t-maybe.selected .t-icon { color: #b8943e; }

        .t-btn.t-yes.selected { border-color: var(--rose); background: var(--rose-light); }
        .t-btn.t-yes.selected .t-label { color: var(--rose); }
        .t-btn.t-yes.selected .t-icon { color: var(--rose); }

        /* ===== 2択トグル ===== */
        .toggle-2 {
            display: flex; flex-direction: column;
            gap: 10px; width: 100%;
        }
        .toggle-2 .t2-btn {
            width: 100%; padding: 16px 16px;
            border: 2px solid #e8e4df;
            border-radius: 14px;
            background: #fff;
            cursor: pointer; transition: all 0.15s;
            text-align: left;
            font-size: 0.85rem; color: #555;
            line-height: 1.6;
            font-family: 'Shippori Mincho', serif;
            -webkit-tap-highlight-color: transparent;
        }
        .toggle-2 .t2-btn:active { transform: scale(0.98); }
        .t2-arrow { font-size: 0.65rem; color: #bbb; margin-right: 6px; font-weight: 700; }

        .t2-btn.t2-left.selected { border-color: #7aa3c8; background: #eef4fa; color: #4a7a9c; }
        .t2-btn.t2-right.selected { border-color: var(--rose); background: var(--rose-light); color: var(--rose); }

        /* ===== 属性 ===== */
        .demo-section {
            width: 100%; max-width: 360px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            padding: 28px 16px;
            animation: cardIn 0.3s ease-out;
        }
        .demo-title {
            font-size: 0.9rem; font-weight: 700;
            text-align: center; margin-bottom: 22px;
            color: #444;
        }
        .demo-group { margin-bottom: 18px; }
        .demo-group label {
            font-size: 0.72rem; color: #888;
            display: block; margin-bottom: 8px;
        }
        .demo-options { display: flex; flex-wrap: wrap; gap: 8px; }
        .demo-opt {
            padding: 8px 14px;
            border: 2px solid #e8e4df;
            border-radius: 10px;
            font-size: 0.78rem; color: #666;
            cursor: pointer; transition: all 0.15s;
            font-family: 'Shippori Mincho', serif;
            -webkit-tap-highlight-color: transparent;
        }
        .demo-opt:active { transform: scale(0.96); }
        .demo-opt.selected {
            border-color: var(--rose);
            background: var(--rose-light);
            color: var(--rose); font-weight: 700;
        }
        .demo-submit {
            display: block; width: 100%;
            padding: 16px; margin-top: 22px;
            border: none; border-radius: 14px;
            background: #ddd; color: #fff;
            font-family: 'Shippori Mincho', serif;
            font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: all 0.3s;
            pointer-events: none;
        }
        .demo-submit.ready {
            background: linear-gradient(135deg, #F06292, #D05A7C);
            box-shadow: 0 4px 15px rgba(232,107,143,0.3);
            pointer-events: auto;
        }
        .demo-submit.ready:active { transform: scale(0.97); }

        /* ===== キャラ出現（透過背景） ===== */
        .reveal {
            position: fixed; inset: 0; z-index: 200;
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            background: rgba(250,247,243,0.97);
            text-align: center; padding: 20px;
        }
        .reveal.active { display: flex; animation: fadeUp 0.6s ease-out; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .reveal img {
            width: 200px; height: 200px;
            object-fit: contain;
            margin-bottom: 20px;
            background: transparent;
            filter: drop-shadow(0 8px 20px rgba(200,90,124,0.15));
        }
        .reveal .r-name {
            font-size: 1.5rem; font-weight: 700;
            color: #333; margin-bottom: 6px;
        }
        .reveal .r-en {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.9rem; color: #999;
            font-style: italic; margin-bottom: 30px;
        }
        .reveal .r-btn {
            padding: 16px 50px;
            background: linear-gradient(135deg, #F06292, #D05A7C);
            color: #fff; border: none;
            border-radius: 50px;
            font-family: 'Shippori Mincho', serif;
            font-size: 1rem; font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(232,107,143,0.35);
        }
        .reveal .r-btn:active { transform: scale(0.96); }

        /* ===== 水彩背景 ===== */
        .splash {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0; pointer-events: none; overflow: hidden;
        }
        .splash-dot {
            position: absolute; border-radius: 50%;
            opacity: 0.12; filter: blur(50px);
        }
    </style>
</head>
<body>

<div class="splash" id="splashBg"></div>

<div class="nav">
    <a href="/" class="nav-logo">ExC CANVAS</a>
    <div class="nav-right">
        <button class="nav-back" id="backBtn" onclick="goBack()" style="display:none">← 戻る</button>
        <a href="/" class="nav-home">トップ</a>
    </div>
</div>

<div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">1 / 49</div>
</div>

<div class="question-area" id="questionArea"></div>

<div class="reveal" id="reveal">
    <img id="revealImg" src="">
    <div class="r-name" id="revealName"></div>
    <div class="r-en" id="revealNameEn"></div>
    <button class="r-btn" onclick="goToResult()">詳しく見る →</button>
</div>

<script>
// ===========================
// 質問データ
// ===========================
const capitalQuestions = [
    { q: "スポーツや運動、ダンスなどで\n大会に出たり、毎日練習するほど\nのめり込んだ経験はありますか？", axis: "physical" },
    { q: "忘れられないほど\n体力の限界に挑んだ\n経験はありますか？", axis: "physical" },
    { q: "「あの味が忘れられない」と\n今でも思い出す食事や、あるいは\n鳥肌が立つほどの音楽体験はありますか？", axis: "physical" },
    { q: "寝食を忘れるほど、\n学びや研究に没頭した\n経験はありますか？", axis: "intellectual" },
    { q: "難しい問題・概念について熟考した結果、\n深く理解できた時の喜びを\n経験したことはありますか？", axis: "intellectual" },
    { q: "専門書を読んだり人に会いに行くなど、\n一つのテーマを徹底的に\n追究した経験はありますか？", axis: "intellectual" },
    { q: "自発的に何か新しいもの\n（企画、作品、アイデアなど）を\n形にした経験はありますか？", axis: "creative" },
    { q: "映画・音楽・絵画などで、\nしばらく頭から離れないほど\n心を奪われた作品はありますか？", axis: "creative" },
    { q: "自分なりの工夫やアレンジで、\n周囲に驚かれたり\n評価された経験はありますか？", axis: "creative" },
    { q: "異なる文化や価値観に触れて、\n自分の常識が揺さぶられた\n経験はありますか？", axis: "cultural" },
    { q: "海外や異なる文化圏で\n一定期間暮らした\n経験はありますか？", axis: "cultural" },
    { q: "自分のルーツや育った文化について\n深く考えたり、知ろうとした\n経験はありますか？", axis: "cultural" },
    { q: "自分の役割がチームや社会に\n確かに貢献していると\n強く実感した経験はありますか？", axis: "social" },
    { q: "チームで大きなことを\n成し遂げた\n経験はありますか？", axis: "social" },
    { q: "学校や職場以外で、\n自発的にコミュニティに\n参加した経験はありますか？", axis: "social" },
    { q: "怒り・悲しみ・不安などの感情に圧倒され、\n自分と深く向き合わざるを得なかった\n経験はありますか？", axis: "emotional" },
    { q: "人生のどん底のような\n絶望を経験した\nことはありますか？", axis: "emotional" },
    { q: "涙が止まらないほどの感動や、\n心が震えるような体験を\nしたことはありますか？", axis: "emotional" },
    { q: "人生や生きる意味について\n真剣に向き合った\n経験はありますか？", axis: "spiritual" },
    { q: "大切な人との死別や離別が、\n自分の生き方に大きな影響を\n与えた経験はありますか？", axis: "spiritual" },
    { q: "瞑想・祈り・内省など、\n静かに自分と向き合う時間を\n持ったことはありますか？", axis: "spiritual" },
    { q: "長い年月をかけて\n何かを達成した\n経験はありますか？", axis: "temporal" },
    { q: "あえて遠回りや寄り道をしたことが、\n結果的に自分の財産になった\n経験はありますか？", axis: "temporal" },
    { q: "「あの経験がなければ今の自分はいない」\nと思えるような\n成長体験はありますか？", axis: "temporal" },
    { q: "住む場所や環境が\n大きく変わった\n経験はありますか？", axis: "spatial" },
    { q: "一人旅で、まったく知らない土地に\n飛び込んだ\n経験はありますか？", axis: "spatial" },
    { q: "ある場所での体験が忘れられず、\n何度も足を運んだ\n経験はありますか？", axis: "spatial" },
    { q: "予期せぬ出来事がきっかけで、\n人生が大きく動いた\n経験はありますか？", axis: "serendipity" },
    { q: "たまたま隣にいた人、たまたま見た情報など、\n偶然の出会いがその後の人生に\n繋がった経験はありますか？", axis: "serendipity" },
    { q: "予定が狂ったおかげで、\nむしろ良い結果になった\n経験はありますか？", axis: "serendipity" },
    { q: "自然の中で、人生観が変わるほどの\n圧倒的な景色や体験に\n出会ったことはありますか？", axis: "natural" },
    { q: "台風・地震・大雪など、\n自然の脅威を身をもって\n体験したことはありますか？", axis: "natural" },
    { q: "動物や植物を育てることに、\n深く心を満たされた\n経験はありますか？", axis: "natural" },
    { q: "お金について強く不安を\n感じたことは\nありますか？", axis: "economic" },
    { q: "大きな経済的決断\n（投資、転職、起業、家の購入など）を\nした経験はありますか？", axis: "economic" },
    { q: "お金の使い方で、\n大きな後悔または大きな満足を\n感じた経験はありますか？", axis: "economic" },
];

const typeQuestions = [
    { q: "これまでの人生で、\nよりエネルギーを得てきたのは？", left: "一人の静かな時間", right: "人と過ごす時間", typeAxis: "ie" },
    { q: "困難な問題に直面した時、\nこれまでより多く選んできた方法は？", left: "まず一人で考える", right: "まず誰かに相談する", typeAxis: "ie" },
    { q: "新しい環境に入った時、\nどちらの行動が多いですか？", left: "まず周りを観察する", right: "すぐ人に話しかける", typeAxis: "ie" },
    { q: "これまでの人生で、\nより充実感を感じてきたのは？", left: "計画通りに進んだ時", right: "臨機応変に動けた時", typeAxis: "of" },
    { q: "日常生活において、\nこれまでより強くストレスを感じたのは？", left: "予定が崩れる時", right: "ルールに縛られる時", typeAxis: "of" },
    { q: "旅行するなら、\nどちらかといえば？", left: "しっかり計画を立てる", right: "行き当たりばったり", typeAxis: "of" },
    { q: "休日や自由な時間は、\nどちらかといえばどのように\n過ごすことが多いですか？", left: "内面を豊かにする時間", right: "外に出て体験する時間", typeAxis: "sm" },
    { q: "振り返ってみて、どちらの方が\n充実感を感じることが\n多かったですか？", left: "深く理解・納得した時", right: "目に見える成果を得た時", typeAxis: "sm" },
    { q: "あなたにとっての\n「成功」に近いのは？", left: "内面の成長や気づき", right: "具体的な達成や評価", typeAxis: "sm" },
    { q: "これまでより多く\n経験してきたのは？", left: "一人で道を切り開く", right: "人と共に歩む", typeAxis: "ir" },
    { q: "人間関係において、\nこれまでより強くストレスを\n感じたのは？", left: "自由を制限される時", right: "孤立を感じる時", typeAxis: "ir" },
    { q: "大きな決断をする時、\nこれまでより多く選んできたのは？", left: "自分の直感を信じる", right: "周囲の意見を大切にする", typeAxis: "ir" },
];

const totalQuestions = capitalQuestions.length + typeQuestions.length + 1;
const axisLabels = { physical:'身体的', intellectual:'知的', creative:'創造的', cultural:'文化的', social:'社会的', emotional:'感情的', spiritual:'精神的', temporal:'時間的', spatial:'空間的', serendipity:'偶然的', natural:'自然的', economic:'経済的' };

let currentIndex = 0;
let answers = {};
let demoData = {};
const diagnosisStartTime = Date.now();

function getPhase() {
    if (currentIndex < capitalQuestions.length) return 'capital';
    if (currentIndex < capitalQuestions.length + typeQuestions.length) return 'type';
    return 'demographics';
}

// ===========================
// 水彩背景
// ===========================
const splashColors = ['#E8B4B8','#B8D4E3','#F5D5A0','#C8E6C9','#D1C4E9','#FFCCBC','#B2DFDB','#F8BBD0'];
function initSplash() {
    const bg = document.getElementById('splashBg');
    for (let i = 0; i < 6; i++) {
        const d = document.createElement('div');
        d.className = 'splash-dot';
        const s = 150 + Math.random() * 250;
        d.style.cssText = `width:${s}px;height:${s}px;left:${Math.random()*100}%;top:${Math.random()*100}%;background:${splashColors[i % splashColors.length]}`;
        bg.appendChild(d);
    }
}
function addSplash() {
    const bg = document.getElementById('splashBg');
    const d = document.createElement('div');
    d.className = 'splash-dot';
    const s = 100 + Math.random() * 200;
    d.style.cssText = `width:${s}px;height:${s}px;left:${Math.random()*100}%;top:${Math.random()*100}%;background:${splashColors[Math.floor(Math.random()*splashColors.length)]}`;
    bg.appendChild(d);
}

// ===========================
// 描画
// ===========================
function render() {
    const area = document.getElementById('questionArea');
    const phase = getPhase();
    const pct = (currentIndex / totalQuestions) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressText').textContent = `${currentIndex + 1} / ${totalQuestions}`;
    document.getElementById('backBtn').style.display = currentIndex > 0 ? '' : 'none';

    if (phase === 'capital') {
        const q = capitalQuestions[currentIndex];
        const axisIdx = Math.floor(currentIndex / 3);
        const axisName = Object.values(axisLabels)[axisIdx] || '';
        area.innerHTML = `
            <div class="q-card">
                <div class="q-section-label">${axisName}体験 ${(currentIndex % 3) + 1}/3</div>
                <div class="q-text">${q.q}</div>
                <div class="toggle-3">
                    <div class="t-btn t-no" onclick="answer3(0)">
                        <span class="t-icon">✕</span>
                        <span class="t-label">ない</span>
                    </div>
                    <div class="t-btn t-maybe" onclick="answer3(1)">
                        <span class="t-icon">△</span>
                        <span class="t-label">うっすら<br>覚えてる</span>
                    </div>
                    <div class="t-btn t-yes" onclick="answer3(2)">
                        <span class="t-icon">○</span>
                        <span class="t-label">はっきり<br>ある</span>
                    </div>
                </div>
            </div>`;
    } else if (phase === 'type') {
        const qi = currentIndex - capitalQuestions.length;
        const q = typeQuestions[qi];
        area.innerHTML = `
            <div class="q-card">
                <div class="q-section-label">タイプ判定 ${qi + 1}/12</div>
                <div class="q-text">${q.q}</div>
                <div class="toggle-2">
                    <div class="t2-btn t2-left" onclick="answer2(0)"><span class="t2-arrow">A.</span>${q.left}</div>
                    <div class="t2-btn t2-right" onclick="answer2(1)"><span class="t2-arrow">B.</span>${q.right}</div>
                </div>
            </div>`;
    } else {
        area.innerHTML = `
            <div class="demo-section">
                <div class="demo-title">最後に、あなたについて教えてください</div>
                <div class="demo-group">
                    <label>年齢</label>
                    <div class="demo-options">
                        <div class="demo-opt" onclick="selectDemo('age',this)">〜19歳</div>
                        <div class="demo-opt" onclick="selectDemo('age',this)">20代</div>
                        <div class="demo-opt" onclick="selectDemo('age',this)">30代</div>
                        <div class="demo-opt" onclick="selectDemo('age',this)">40代</div>
                        <div class="demo-opt" onclick="selectDemo('age',this)">50代〜</div>
                    </div>
                </div>

function calculateResult() {
    const capitalScores = {physical:0,intellectual:0,creative:0,cultural:0,social:0,emotional:0,spiritual:0,temporal:0,spatial:0,serendipity:0,natural:0,economic:0};
    for (let i = 0; i < capitalQuestions.length; i++) capitalScores[capitalQuestions[i].axis] += answers[i] || 0;
    const typeScores = {ie:0,of:0,sm:0,ir:0};
    const tb = capitalQuestions.length;
    for (let i = 0; i < typeQuestions.length; i++) typeScores[typeQuestions[i].typeAxis] += answers[tb+i] || 0;
    const is_i=typeScores.ie<2, is_o=typeScores.of<2, is_s=typeScores.sm<2, is_ind=typeScores.ir<2;
    const typeKey = `${is_i?'introvert':'extrovert'}_${is_o?'order':'freedom'}_${is_ind?'independent':'relation'}_${is_s?'spirit':'material'}`;
    const typeName = typeMappingNew[typeKey] || "沈黙の賢者";
    return {capitalScores,typeName,typeKey,gender:demoData.gender||'Unknown',ageGroup:demoData.age||'Unknown',
        result:typeInfo[typeName]?{name:typeName,nameEn:typeInfo[typeName].nameEn,img:typeInfo[typeName].img}:null};
}

function submitAll() {
    if (!demoData.age || !demoData.gender) return;
    const r = calculateResult();
    sendToGoogleSheets(r);
    const info = typeInfo[r.typeName];
    document.getElementById('revealImg').src = info.img;
    document.getElementById('revealName').textContent = r.typeName;
    document.getElementById('revealNameEn').textContent = info.nameEn;
    document.getElementById('reveal').classList.add('active');
}

function sendToGoogleSheets(data) {
    const scores = data.capitalScores;
    const total = Object.values(scores).reduce((s,v)=>s+v,0);
    if (total===0) return;
    const axes = Object.keys(scores);
    const rawPct={}; axes.forEach(a=>rawPct[a]=(scores[a]/total)*100);
    const floored={}; axes.forEach(a=>floored[a]=Math.floor(rawPct[a]));
    let sum=axes.reduce((s,a)=>s+floored[a],0);
    const rem=axes.map(a=>({a,r:rawPct[a]-floored[a]})).sort((a,b)=>b.r-a.r);
    let i=0; while(sum<100&&i<rem.length){floored[rem[i].a]++;sum++;i++;}
    const ua=navigator.userAgent; let device='PC';
    if(/iPhone|iPad|iPod/i.test(ua))device='iOS'; else if(/Android/i.test(ua))device='Android';
    const payload = {characterName:data.typeName,typeKey:data.typeKey,gender:data.gender,ageGroup:data.ageGroup,
        ...Object.fromEntries(axes.map(a=>[a,floored[a]])),device,elapsedSeconds:Math.round((Date.now()-diagnosisStartTime)/1000)};
    const URL='https://script.google.com/macros/s/AKfycbwNOCM1DMMRMMexb-zHfryomi4wCFSgH8f5eISSTuo6ZwJitX-2C9u8mXbMNzguXSzUfA/exec';
    fetch(URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).catch(e=>console.error('送信エラー:',e));
}

function goToResult() {
    const r = calculateResult();
    const page = characterFiles[r.typeName] || 'result_sage.html';
    const params = new URLSearchParams();
    Object.entries(r.capitalScores).forEach(([k,v])=>params.append(k,v));
    window.location.href = page + '?' + params.toString();
}
